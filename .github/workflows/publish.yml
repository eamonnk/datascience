name: Render and Publish Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Checks whether R content EXISTS anywhere in the repo (not just whether
      # it changed in this push). This matters because `quarto render` renders
      # the WHOLE project every run, regardless of what triggered the push --
      # so as soon as one R-based .qmd/.R file is committed, every future
      # render (Python-only pushes included) needs R installed to process it.
      - name: Check for R files
        id: filter
        run: |
          if find r-raw r-projects -type f \( -name "*.R" -o -name "*.qmd" \) 2>/dev/null | grep -q .; then
            echo "r=true" >> "$GITHUB_OUTPUT"
          else
            echo "r=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --- Python / Jupyter support, for rendering .ipynb notebooks ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python/Jupyter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbclient nbformat ipykernel \
                      pandas numpy matplotlib seaborn scikit-learn nltk wordcloud umap-learn beautifulsoup4 ydata-profiling imbalanced-learn scipy astropy


      # --- R support, for rendering .qmd/.R files that use R code chunks ---
      # Only runs when r-raw/ or r-projects/ actually changed in this push,
      # to avoid paying the R setup + package install cost on Python-only commits.
      - name: Set up R
        if: steps.filter.outputs.r == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install R dependencies
        if: steps.filter.outputs.r == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::tidyverse
            any::ggplot2
            goodekat/ggResidpanel

      ### Convert any R scripts into Quarto pages
      - name: Convert R scripts
        if: steps.filter.outputs.r == 'true'
        run: |
          python scripts/convert_r_to_qmd.py r-raw

      ### Convert any Jupyter notebooks into Quarto pages
      - name: Convert notebooks
        run: |
          python scripts/convert_ipynb_to_qmd.py notebooks

      ### render site
      - name: Render site
        run: quarto render

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site